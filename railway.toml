# Landing estática — https://docs.railway.com/guides/astro
# En el dashboard: Root Directory = / (raíz del repo), no uses la carpeta plausible/

[build]
builder = "NIXPACKS"
buildCommand = "npm ci && npm run build"

[deploy]
startCommand = "npm run start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
