services:
  postgres:
    image: postgres:16-alpine
    container_name: peranto-postgres
    restart: unless-stopped
    ports:
      - "5438:5432"
    environment:
      POSTGRES_USER: peranto
      POSTGRES_PASSWORD: peranto
      POSTGRES_DB: peranto
    volumes:
      - peranto_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peranto -d peranto"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  peranto_pg_data:
